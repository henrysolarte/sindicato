services:
  # MySQL Database
  - type: pserv
    name: sindicato-db
    plan: free
    image:
      url: mysql:8.0
    envVars:
      - key: MYSQL_ROOT_PASSWORD
        scope: build,runtime
      - key: MYSQL_DATABASE
        value: sindicato
        scope: build,runtime
      - key: MYSQL_USER
        scope: build,runtime
      - key: MYSQL_PASSWORD
        scope: build,runtime
    diskSize: 1
    healthCheckPath: /
    
  # Backend API
  - type: web
    name: sindicato-api
    runtime: node
    plan: free
    rootDir: back
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/test-connection
    depends_on:
      - sindicato-db
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DB_HOST
        fromService:
          name: sindicato-db
          property: host
      - key: DB_USER
        fromService:
          name: sindicato-db
          property: user
      - key: DB_PASSWORD
        fromService:
          name: sindicato-db
          property: password
      - key: DB_NAME
        value: sindicato
      - key: DB_PORT
        value: "3306"

  # Frontend Sindegeologico
  - type: web
    name: sindegeologico-web
    runtime: static
    rootDir: front/sindegeologico
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://sindicato-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # Frontend Formulario SGC
  - type: web
    name: formulario-sgc-web
    runtime: static
    rootDir: front/formulario/FormularioSGC
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://sindicato-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
